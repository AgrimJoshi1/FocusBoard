<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account - FocusBoard</title>
    <link rel="stylesheet" href="/Create/Create.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>

<video autoplay muted loop id="bg-video">
    <source src="/Get-Started/additional/BGVID.webm">
</video>

<div class="login-container">
    <div class="login-box">

        <div class="brand-badge"><span>✦ New Account</span></div>

        <h2>Join FocusBoard</h2>
        <p class="subtitle">Create your free account to get started</p>

        <form id="create-form" novalidate>
            <input type="text" id="username" placeholder="Choose a username" required>
            <input type="email" id="email" placeholder="Enter your email" required>
            <div class="password-box">
                 <input type="password" id="password" placeholder="Create a password" required>

                <span class="toggle-password" onclick="togglePassword('password', this)">
                 👁
                 </span>
            </div>

            <div class="password-strength-container">
            <div id="password-strength-bar"></div>
            </div>
            <p id="password-strength-text"></p>

            <div class="password-box">
                <input type="password" id="confirm-password" placeholder="Confirm password" required>

                <span class="toggle-password" onclick="togglePassword('confirm-password', this)">
                    👁
                </span>
            </div>
            <button type="submit">Create Account →</button>
        </form>

        <p class="extra">
            Already have an account? <a onclick="redirlogin()">Log in</a>
        </p>

    </div>
</div>
<div class="toast" id="toast"></div>
<script src="/Create/Create.js"></script>
</body>
</html>
